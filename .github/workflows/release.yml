name: Release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. 3.2.3)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Show Xcode version
        run: xcodebuild -version

      # Ad-hoc signed (no Developer ID / notarization), same as previous manual releases.
      # Builds by target, so tags without a shared scheme (e.g. 3.2.3) also work.
      - name: Build
        run: |
          xcodebuild \
            -project Gaufre.xcodeproj \
            -target Gaufre \
            -configuration Release \
            SYMROOT="$PWD/build" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            build

      - name: Archive
        run: |
          ditto -c -k --keepParent build/Release/Gaufre.app Gaufre.app.zip
          lipo -archs build/Release/Gaufre.app/Contents/MacOS/Gaufre

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Release already exists (e.g. created manually): just attach the build
            gh release upload "$TAG" Gaufre.app.zip --clobber
          else
            gh release create "$TAG" Gaufre.app.zip \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
